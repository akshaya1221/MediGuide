services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediguide
      POSTGRES_USER: mediguide
      POSTGRES_PASSWORD: mediguide
    ports:
      - "5432:5432"
    volumes:
      - mediguide_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediguide"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mediguide:mediguide@db:5432/mediguide
      STORAGE_PATH: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - mediguide_uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mediguide_pgdata:
  mediguide_uploads:

